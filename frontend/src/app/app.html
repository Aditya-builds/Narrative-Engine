<div class="app-frame" [class.app-frame-chat]="chatMode()">
  <header class="topbar" [class.topbar-chat]="chatMode()">
    <a class="brand" routerLink="/">narrative</a>
    @if (!chatMode()) {
      <label class="top-search">
        <span class="sr-only">Search</span>
        <input
          type="search"
          [value]="query()"
          placeholder="Search for characters..."
          (input)="query.set($any($event.target).value)"
          (keydown.enter)="search()"
        />
      </label>
      <a class="btn primary top-create" routerLink="/characters/new">Create a Character</a>
    }
    <div class="profile-wrap">
      <button
        type="button"
        class="profile-avatar"
        [class.on]="profileOpen()"
        (click)="toggleProfile(); $event.stopPropagation()"
        aria-label="Profile">
        Y
      </button>
      @if (profileOpen()) {
        <nav class="profile-menu" (click)="$event.stopPropagation()">
          <a routerLink="/profile" routerLinkActive="on" (click)="closeProfile()">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.4 3.2 11.2V20.5h6.3v-6.1h4.9v6.1h6.4v-9.3z" /></svg>
            Profile
          </a>
          <a routerLink="/" routerLinkActive="on" [routerLinkActiveOptions]="{ exact: true }" (click)="closeProfile()">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.2 10.2a2.4 2.4 0 1 0 0-4.8 2.4 2.4 0 0 0 0 4.8zm7.6 0a2.4 2.4 0 1 0 0-4.8 2.4 2.4 0 0 0 0 4.8zM4.4 18.8c.6-2.8 2.6-4.3 5.2-4.3 1 0 1.9.2 2.6.7 1.2-.9 2.6-1.3 4.2-1.3 2.6 0 4.6 1.5 5.2 4.3" /></svg>
            My Characters
          </a>
          <a routerLink="/chats" routerLinkActive="on" (click)="closeProfile()">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h11.5v8.2H8.2L4 17.2zm8.2 3.4H20v8.2h-4.2L12.2 21z" /></svg>
            My Chats
          </a>
          <a routerLink="/personas" routerLinkActive="on" (click)="closeProfile()">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5c2.4 1.8 3.6 3.7 3.6 5.6S14.4 12.8 12 14.5C9.6 12.8 8.4 11 8.4 9.1s1.2-3.8 3.6-5.6zm-7.2 15s1.8-3.2 7.2-3.2 7.2 3.2 7.2 3.2" /></svg>
            My Personas
          </a>
        </nav>
      }
    </div>
  </header>
  <div class="app-body" [class.app-body-chat]="chatMode()">
    <router-outlet />
  </div>
</div>
