<section class="page">
  <div class="browse-bar">
    <div class="chats-tabs">
      <span class="on">Characters</span>
    </div>
    <p class="browse-count">{{ visible().length }} characters</p>
  </div>

  @if (error()) {
    <p class="banner">{{ error() }}</p>
  }

  <div class="cast-grid">
    @for (character of visible(); track character.name) {
      <app-entity-card
        kind="character"
        [entity]="character"
        actionLabel="Talk to {{ character.name }}"
        (choose)="talk($event)" />
    }
  </div>
</section>
