name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repository for secrets
        run: gitleaks detect --source . --verbose --redact --exit-code 1 --config .gitleaks.toml

  test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/narrative-engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/narrative-engine/pom.xml

      - name: Run unit and Quarkus tests
        run: |
          chmod +x mvnw
          ./mvnw -B test

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/narrative-engine/target/jacoco-report
          if-no-files-found: ignore

      - name: Upload surefire results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire
          path: backend/narrative-engine/target/surefire-reports
          if-no-files-found: ignore

  agent-test:
    name: Agent tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov pip-audit

      - name: Run agent tests
        run: pytest -q --cov=. --cov-report=xml --cov-report=term-missing --junitxml=pytest-results.xml

      - name: Dependency audit
        continue-on-error: true
        run: pip-audit -r requirements.txt

      - name: Upload coverage and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-test-results
          path: |
            agent/coverage.xml
            agent/pytest-results.xml
          if-no-files-found: ignore

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: npm audit
        continue-on-error: true
        run: npm audit --omit=dev
