character.storage.path=../../World/Characters
persona.storage.path=../../World/Persona
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,x-request-id,x-openai-api-key,idempotency-key
quarkus.http.cors.exposed-headers=X-Request-ID
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p requestId=%X{requestId} [%c{2.}] (%t) %s%e%n